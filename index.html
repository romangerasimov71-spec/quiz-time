<!-- Тесты: каждый — свой файл. Новый тест = новый файл в tests/ + одна строка здесь. -->

<!-- Площадка (общий шаблон студии, как в «Соннике»): настройки, Playgama Bridge, статистика -->
<script src="config.js"></script>
<script src="platform.js"></script>
<script src="analytics.js"></script>
<script>
/* Запуск: сначала площадка (Playgama Bridge — ВК, ОК или обычный браузер), потом движок.
   Bridge ждём не дольше 8 с, и всё вместе — не дольше 10 с от начала загрузки страницы. */
(function () {
  var files = ['js/storage.js', 'js/sound.js', 'js/share.js', 'js/app.js'];
  function load(i) {
    if (i >= files.length) return;
    var s = document.createElement('script');
    s.src = files[i];
    s.onload = function () { load(i + 1); };
    s.onerror = function () {
      var a = document.getElementById('app');
      if (a) a.innerHTML = '<p class="noscript">Не получилось загрузить викторины. Обновите страницу.</p>';
    };
    document.body.appendChild(s);
  }
  var started = false;
  function go() { if (!started) { started = true; load(0); } }
  setTimeout(go, Math.max(0, 10500 - (window.performance && performance.now ? performance.now() : 0)));
  if (!window.Platform) { go(); return; }
  window.Platform.init({ timeoutMs: 8000, deadlineMs: 10000, localPrefix: '' }).then(go, go);
})();
</script>
